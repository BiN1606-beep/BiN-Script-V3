name: CI

on:
  push:
    branches: [ "professional" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v1
      - name: Configure and Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -- -j
          ctest --test-dir build --output-on-failure
      - name: Configure and Build (Windows MSYS2/MinGW)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
        run: |
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -- -j
          ctest --test-dir build --output-on-failure

  phone_compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v1
      - name: Configure with phone compatibility
        run: |
          cmake -S . -B build-phone -DBS_PHONE_COMPAT=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-phone --config Debug -- -j
          ctest --test-dir build-phone --output-on-failure
